<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شات سوريا - الروم العام</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #ffffff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    /* شاشة الدخول */
    .login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #121212; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
    .login-box { background: #1e1e1e; padding: 25px; border-radius: 12px; width: 100%; max-width: 320px; text-align: center; border: 1px solid #333; }
    .login-box h2 { color: #ff4081; margin-bottom: 15px; font-size: 20px; }
    .login-box input, .login-box select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #2c2c2c; color: white; margin-bottom: 15px; text-align: center; font-size: 15px; outline: none; }
    .login-box button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #ff4081; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }

    /* الشريط العلوي */
    .top-bar { background: #1a1a1a; color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
    .top-icons { display: flex; gap: 15px; font-size: 18px; }
    .room-title { font-weight: bold; font-size: 15px; color: #ff4081; }

    /* منطقة الرسائل */
    .chat-area { flex: 1; overflow-y: auto; padding: 10px; background: #f5f5f5; display: flex; flex-direction: column; gap: 10px; }
    .msg-row { display: flex; align-items: flex-start; gap: 8px; }
    .avatar-box { display: flex; flex-direction: column; align-items: center; width: 45px; }
    .avatar { width: 42px; height: 42px; border-radius: 6px; background: #333; border: 1px solid #ccc; }
    .level-badge { background: #e91e63; color: white; font-size: 10px; width: 100%; text-align: center; border-radius: 3px; margin-top: 2px; font-weight: bold; }
    .msg-bubble { flex: 1; background: #222222; color: white; border-radius: 8px; padding: 8px 12px; }
    .msg-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; border-bottom: 1px solid #333; padding-bottom: 3px; }
    .username { font-size: 13px; font-weight: bold; }
    .time { color: #888; font-size: 11px; }
    .msg-text { font-size: 14px; line-height: 1.4; color: #eeeeee; }

    /* شريط الأدوات ومربع الكتابة */
    .tools-bar { background: #eeeeee; padding: 6px 10px; display: flex; justify-content: space-around; border-top: 1px solid #ccc; font-size: 16px; }
    .input-bar { background: #ffffff; padding: 8px; display: flex; align-items: center; gap: 8px; border-top: 1px solid #ddd; }
    .input-bar input { flex: 1; padding: 10px 15px; border-radius: 20px; border: 1px solid #ccc; outline: none; font-size: 14px; }
    .send-btn { background: #ff9800; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; cursor: pointer; }
    .mic-btn { background: #03a9f4; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- شاشة الدخول -->
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <h2>أهلاً بك في الشات</h2>
      <input type="text" id="usernameInput" placeholder="اكتب اسمك المستعار هنا...">
      <select id="colorInput">
        <option value="#ff80ab">لون الاسم: وردي</option>
        <option value="#00e676">لون الاسم: أخضر</option>
        <option value="#00b0ff">لون الاسم: أزرق</option>
        <option value="#ffeb3b">لون الاسم: أصفر</option>
      </select>
      <button onclick="enterChat()">دخول الدردشة</button>
    </div>
  </div>

  <!-- الشريط العلوي -->
  <div class="top-bar">
    <div>☰ <span class="room-title">شات سوريا العام</span></div>
    <div class="top-icons"><span>👤</span><span>🔔</span><span>🔗</span></div>
  </div>

  <!-- منطقة المحادثة -->
  <div class="chat-area" id="chatBox"></div>

  <!-- شريط الأيقونات -->
  <div class="tools-bar">
    <span>👥</span><span>⚙️</span><span>🔒</span><span>🔊</span><span>📹</span>
  </div>

  <!-- شريط الإرسال -->
  <div class="input-bar">
    <button class="mic-btn">🎤</button>
    <input type="text" id="msgInput" placeholder="اكتب هنا...">
    <button class="send-btn" onclick="sendMsg()">➤</button>
  </div>

  <script>
    var myName = "زائر";
    var myColor = "#ff80ab";

    function enterChat() {
      var nameInput = document.getElementById("usernameInput").value;
      if (nameInput.trim() === "") return;
      
      myName = nameInput;
      myColor = document.getElementById("colorInput").value;
      document.getElementById("loginScreen").style.display = "none";
    }

    function sendMsg() {
      var input = document.getElementById("msgInput");
      var text = input.value;
      if (text.trim() === "") return;

      var now = new Date();
      var timeStr = now.getHours() + ":" + (now.getMinutes()<10?'0':'') + now.getMinutes();

      var chatBox = document.getElementById("chatBox");
      chatBox.innerHTML += `
        <div class="msg-row">
          <div class="avatar-box">
            <div class="avatar" style="background:#009688;"></div>
            <div class="level-badge">1</div>
          </div>
          <div class="msg-bubble">
            <div class="msg-header">
              <span class="username" style="color:${myColor}">${myName}</span>
              <span class="time">${timeStr}</span>
            </div>
            <div class="msg-text">${text}</div>
          </div>
        </div>
      `;
      input.value = "";
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>

</body>
</html>
